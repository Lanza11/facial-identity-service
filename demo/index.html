<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Servicio de identificación facial</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#inicio" aria-label="Inicio">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <ellipse cx="20" cy="20" rx="13" ry="16" fill="none" stroke="currentColor" stroke-width="3.2"/>
        <path d="M13.5 23.5c3.6 3.4 9.4 3.4 13 0" fill="none" stroke="var(--mango)" stroke-width="3.2" stroke-linecap="round"/>
        <circle cx="15.5" cy="16.5" r="2" fill="currentColor"/>
        <circle cx="24.5" cy="16.5" r="2" fill="currentColor"/>
      </svg>
      <span class="brand-text">Servicio de identificación facial</span>
    </a>
    <nav class="topnav" aria-label="Principal">
      <a href="#inicio" data-nav="inicio">Demostración</a>
      <a href="#personas" data-nav="personas" class="tech-only">Personas</a>
      <a href="#auditoria" data-nav="auditoria" class="tech-only">Auditoría</a>
      <a href="/docs" target="_blank" rel="noopener" class="tech-only">Swagger ↗</a>
    </nav>
    <div class="topbar-tools">
      <span id="engine-badge" class="badge tech-only">motor…</span>
      <label class="tech-only key-field" for="api-key">API key
        <input id="api-key" type="text" autocomplete="off" spellcheck="false">
      </label>
      <label class="switch" for="tech-toggle">
        <input id="tech-toggle" type="checkbox">
        <span class="switch-track" aria-hidden="true"></span>
        <span>Modo técnico</span>
      </label>
    </div>
  </header>

  <main id="view" class="page" tabindex="-1"></main>

  <section id="calls" class="calls tech-only" aria-label="Llamadas al servicio">
    <details>
      <summary>Llamadas al servicio <span id="calls-count" class="badge">0</span></summary>
      <ol id="calls-list"></ol>
    </details>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
